name: Deploy Snake Game

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git commit SHA to deploy'
        required: false
      udap_run_id:
        description: 'UDAP run identifier'
        required: false

concurrency:
  group: deploy-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.revision || github.sha }}
          path: dist/
          retention-days: 1

  provision:
    name: Provision Infrastructure
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      bucket_name: ${{ steps.tf_output.outputs.bucket_name }}
      distribution_id: ${{ steps.tf_output.outputs.distribution_id }}
      site_url: ${{ steps.tf_output.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.0'
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_service_name: ${{ vars.SERVICE_NAME }}

      - name: Capture outputs
        id: tf_output
        working-directory: infra
        run: |
          echo "bucket_name=$(terraform output -raw bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "site_url=$(terraform output -raw site_url)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to S3 + Invalidate CloudFront
    needs: provision
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.revision || github.sha }}
          path: dist/

      - name: Sync dist to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.provision.outputs.bucket_name }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          # index.html should not be cached long
          aws s3 cp dist/index.html s3://${{ needs.provision.outputs.bucket_name }}/index.html \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.provision.outputs.distribution_id }} \
            --paths "/*"

  verify:
    name: Verify Live
    needs: [provision, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CloudFront to serve the site
        run: |
          URL="${{ needs.provision.outputs.site_url }}"
          echo "Polling $URL ..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Live URL: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "Site did not respond 200 within 5 minutes"
          exit 1
